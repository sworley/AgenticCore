name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install mdbook
        run: cargo install mdbook --version 0.5.3

      - name: mdbook build
        run: cd mddocs && mdbook build

      - name: Check internal links
        run: ./mddocs/scripts/check-links.sh

      - name: Reconcile metadata registry (SH-0028)
        run: python3 mddocs/scripts/reconcile-metadata-registry.py --check

      - name: Privacy / personal-value scan
        run: ./mddocs/scripts/check-privacy.sh

      - name: Bash syntax check
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: Run test harnesses (skip e2e)
        run: |
          bash mddocs/scripts/test-adopt-target-handling.sh --skip-e2e
          bash mddocs/scripts/test-provision-bench-substitution.sh --skip-e2e

      - name: Configure git identity (for export/severance harness)
        run: |
          git config --global user.name "AgenticCore CI"
          git config --global user.email "ci@agenticcore.invalid"

      - name: Run export/severance harness (D-7.3/D-7.4/D-7.5 + fail-closed surface)
        run: bash mddocs/scripts/test-export-framework-severance.sh
