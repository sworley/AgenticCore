[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-ledger"
version = "0.1.0"
description = "File-backed YAML ledger MCP server for security and review findings"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "pyyaml==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
