  - id: AC-0017
    title: "Adopt GitHub branch-protection rulesets for main and dev"
    description: |
      Implement ADR-0036: adopt GitHub branch-protection rulesets as the
      server-side enforcement layer for the `main` append-only / merge-only rule
      (previously ADR-0004, deferred to TC-002) and for the PR-gated integration
      into `dev`. Two active rulesets are defined:

        - main-strict (target `main`): block creation/deletion/non-fast-forward;
          require a pull request with the `verify` CI check, strict (branches up
          to date), 0 approving reviews and no code-owner review (single-operator;
          GitHub disallows self-approval, so the gate is CI + workflow + signed
          commits); require signed commits. Bypass actor: the operator account
          (deliberate lock-out avoidance; agentic sessions share that identity).
        - dev-strict (target `dev`): same shape as main-strict - block
          creation/deletion/non-fast-forward (`dev` is shared and never rebased);
          require a pull request with strict `verify` CI, 0 approving reviews and
          no code-owner review; require signed commits. Bypass actor: the operator
          account.

      Branch naming (PROCESS.md §5) is a documented convention enforced locally,
      not via these rulesets; there is no server-side branch-name validation.

      ADR-0036 supersedes ADR-0004 (clean forward-only supersession, recorded in
      the supersession ledger). ADR-0004 is marked `superseded` (metadata only).
      The legacy branch protection on `main` and `dev` is removed once the
      rulesets are active (single source of truth). The ruleset definitions are
      versioned in the runbook
      mddocs/management/agentic/procedures/branch-protection-rulesets.md.

      Note: single-operator harness - the operator is the only human; these
      rulesets are a process-level backstop, with local pre-commit hooks (ADR-0022)
      and HIL discipline as the first line of defense.
    acceptance_criteria:
      - "ADR-0036 created in mddocs/management/governance/decisions/ superseding ADR-0004 (forward-only)"
      - "ADR-0004 marked superseded by ADR-0036 (status metadata only; body unedited)"
      - "supersession-ledger.yaml records ADR-0004 -> ADR-0036 (retired: false)"
      - "active decisions index lists ADR-0036; historical index marks ADR-0004 superseded"
      - "runbook branch-protection-rulesets.md documents main-strict + dev-strict, bypass actor, apply/verify/rollback"
      - "dev-strict mirrors main-strict (PR + strict verify CI + signed commits + operator bypass), targeting dev"
      - "reconcile-metadata-registry.py --check validates the supersession ledger and passes"
      - "mdbook build and check-links pass; no em-dashes"
      - "legacy branch protection on main and dev removed after rulesets active (applied out-of-band by operator)"
    adr: [ADR-0004, ADR-0036]
