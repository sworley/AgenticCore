# tasks.yaml — AgenticCore Task Queue
#
# Single source of truth for all work in the harness. Maintained by
# lead-engineer (`.01`). Only `.01` writes to this file. See
# `.core/work/README.md` for the full schema and lifecycle reference.
#
# ADR provenance rule: if a task's scope touches governed behavior
# (task-queue rules, bench model, HIL gates, agent roster, security
# controls, branch protection), the `adr` field must list the accepted
# ADR(s) that authorize the change.

tasks:
  - id: AC-0001
    title: "Initialize AgenticCore baseline"
    description: |
      Establish the initial harness baseline: canonical agent roster,
      enforcement hooks, ADR governance layer, and bench model.
    acceptance_criteria:
      - "All registry agents import cleanly"
      - "Hook wiring passes check-hook-wiring"
      - "mdbook builds with zero errors"
    adr: [ADR-0001]
    priority: P1
    size: M
    labels: [chore, bootstrap]
    agent: lead-engineer
    status: merged
    branch: "main"
    bench: .01
    blocked_by: []
    created: "2026-11-01"
    updated: "2026-11-02"
    completed_at: "2026-11-02T09:19:33"

  - id: AC-0002
    title: "Formalize framework release & baseline process (leads to v0.6.0)"
    description: |
      Establish a formal, release-baseline process for AgenticCore:
      1. Resolve the baseline-steward vs release-engineer role split (framework
         release ownership/gating vs tactical execution).
      2. Make the release runbook authoritative: release-process.md owned and
         gated by baseline-steward, with tactical release mechanics (prep branch,
         cherry-pick/merge, tag, release branch) executed by release-engineer.
      3. Set up release scaffolding with v0.5.0 as the starting baseline: running
         release-notes draft (mddocs/release-notes/UNRELEASED.md), CHANGELOG and
         README Releases section reflecting the baseline and the new process.
      No backfill of pre-v0.5.0 history. Release notes for v0.6.0 are seeded at
      release time (Phase 2).
    acceptance_criteria:
      - "baseline-steward is unambiguous owner/gate of the framework release; release-engineer scoped to tactical execution"
      - "release-process.md attributed to baseline-steward with explicit release-engineer delegation and the tag-to-main flow"
      - "release scaffolding established on the v0.5.0 baseline; CHANGELOG and README updated"
      - "agents re-synced (.opencode/agents/) and mdbook builds with zero errors"
    adr: [ADR-0026]
    priority: P1
    size: M
    labels: [docs, governance, release]
    agent: baseline-steward
    status: released
    branch: "docs/AC-0002-release-process-formalization"
    bench: .01
    blocked_by: []
    created: "2026-11-08"
    updated: "2026-11-08"
    started_at: "2026-11-08T12:00:00"
    released_in: "v0.6.0"
    completed_at: "2026-11-08T15:30:00"

  - id: AC-0003
    title: "Release v0.6.0"
    description: |
      Cut the v0.6.0 release from dev to main under the formalized release process:
      establish the v0.5.0 baseline tag, curate release/v0.6.0-prep (all-selected from
      dev), gate via security/docs review + HIL, tag v0.6.0, cut release/v0.6.0,
      update README as-built, and merge main back to dev.
    acceptance_criteria:
      - "mddocs/release-notes/v0.6.0.md published"
      - "v0.6.0 tag pushed"
      - "release/v0.6.0 branch pushed"
      - "README as-built updated"
      - "main → dev merge-back complete; tickets released"
    adr: [ADR-0026]
    priority: P1
    size: S
    labels: [release]
    agent: baseline-steward
    status: released
    branch: "release/v0.6.0-prep"
    bench: .01
    blocked_by: [AC-0002]
    created: "2026-11-08"
    updated: "2026-11-08"
    started_at: "2026-11-08T13:00:00"
    released_in: "v0.6.0"
    completed_at: "2026-11-08T15:30:00"

